name: Debug - Pipeline Job Status (temporary)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Fabric branch/env to inspect (dev, qa, main)"
        required: true
        default: "dev"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Inspect pipeline job status
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: python scripts/debug_pipeline_status.py
